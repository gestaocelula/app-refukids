name: Compilar APK Refúkids (Flutter Nativo)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
          cache: true

      - name: Gerar estrutura nativa e instalar pacotes
        run: |
          flutter create --org com.refukids --project-name app_refukids .
          flutter pub add image_picker sqflite path url_launcher

      - name: Compilar APK Release
        run: |
          flutter build apk --release

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: refukids-app
          path: build/app/outputs/flutter-apk/app-release.apk
